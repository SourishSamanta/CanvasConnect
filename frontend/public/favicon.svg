<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Canvas Layer Frame -->
  <rect x="64" y="64" width="384" height="384" rx="48" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3" filter="url(#shadow)"/>
  
  <!-- Grid Dots Preview -->
  <circle cx="160" cy="160" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="256" cy="160" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="352" cy="160" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="160" cy="256" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="352" cy="256" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="160" cy="352" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="256" cy="352" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="352" cy="352" r="6" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Canvas Path / Brush Stroke -->
  <path d="M 140 330 C 180 230, 240 370, 320 220 C 350 170, 380 180, 370 210" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Floating Pen Accent -->
  <path d="M 320 140 L 370 190 L 260 300 L 210 250 Z" fill="url(#brushGrad)" />
  <path d="M 210 250 L 190 310 L 260 300 Z" fill="#e11d48" />
  <circle cx="195" cy="305" r="4" fill="#ffffff" />
</svg>
